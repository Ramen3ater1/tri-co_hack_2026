# XcodeGen spec for a notarizable Mac build (Developer ID), used by release.sh. The everyday build is still ../build.sh.
name: DialecticMac
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  Dialectic:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/Dialectic
      - path: ../stub-locate-response.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.dialectic.mac
        PRODUCT_NAME: Dialectic
        DEVELOPMENT_TEAM: SGL8MGZNZV
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Dialectic
        LSUIElement: true
        NSHighResolutionCapable: true
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: true}
        CFBundleURLTypes:
          - CFBundleURLName: space.dialectic.mac.login
            CFBundleURLSchemes: [dialectic]
