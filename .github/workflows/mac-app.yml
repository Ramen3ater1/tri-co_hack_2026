# Builds the Mac app on every push that touches app/mac, so teammates without Xcode can
# download it and a broken Swift build shows up straight away. See app/mac/README.md.
# The downloadable build talks to the dev copy (https://dialectic-dev.yaggy.dev), not
# localhost: CI swaps DEFAULT_SERVER_URL before building (the menu's Server pick still wins).
name: Mac app

on:
  push:
    branches: [main]
    paths: ["app/mac/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

env:
  BUILD_SERVER_URL: https://dialectic-dev.yaggy.dev

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # Secrets can't be tested in a step's `if:`, so expose whether they're set.
      HAS_SIGNING: ${{ secrets.MAC_CERT_P12 != '' && secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the build at the dev copy
        run: |
          sed -i '' "s|^let DEFAULT_SERVER_URL = \".*\"|let DEFAULT_SERVER_URL = \"$BUILD_SERVER_URL\"|" app/mac/Sources/Dialectic/DialecticApp.swift
          grep -n '^let DEFAULT_SERVER_URL' app/mac/Sources/Dialectic/DialecticApp.swift

      # Developer ID signing + notarization, when the secrets are set (josoup's Apple account;
      # list in app/mac/README.md). Without them the build is ad-hoc signed, as before.
      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          KC_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings "$KC"   # no auto-lock mid-build
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          # The runner may lack Apple's Developer ID intermediate, which leaves the identity "not valid".
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          ID="$(security find-identity -v -p codesigning "$KC" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$ID" ]; then echo "::error::MAC_CERT_P12 has no 'Developer ID Application' identity"; security find-identity -p codesigning "$KC"; exit 1; fi
          echo "Signing identity: $ID"
          echo "DIALECTIC_SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Build
        run: DIALECTIC_VERSION="${GITHUB_SHA::7}" ./app/mac/build.sh

      # Apple scans the app and issues a ticket; stapling it to the app lets it open on any Mac
      # with no "damaged" warning and no xattr step. Usually 2-10 minutes.
      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        timeout-minutes: 15
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          cd app/mac/build
          ditto -c -k --keepParent Dialectic.app notarize.zip
          AUTH=(--apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID")
          OUT="$(xcrun notarytool submit notarize.zip "${AUTH[@]}" --wait --output-format json)"
          echo "$OUT"
          if [ "$(echo "$OUT" | jq -r .status)" != "Accepted" ]; then
            xcrun notarytool log "$(echo "$OUT" | jq -r .id)" "${AUTH[@]}"
            exit 1
          fi
          xcrun stapler staple Dialectic.app
          spctl --assess --type execute --verbose Dialectic.app
          rm notarize.zip

      - name: Zip the app
        run: |
          cd app/mac/build
          ditto -c -k --keepParent Dialectic.app "Dialectic-dev-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Dialectic-dev-mac
          path: app/mac/build/Dialectic-dev-*.zip
          retention-days: 7

      # Screens drawn with stub data (RenderCheck.swift), so UI changes can be reviewed
      # without a Mac. Best effort: a CI runner may not allow it.
      - name: Render check
        continue-on-error: true
        timeout-minutes: 3
        run: app/mac/build/Dialectic.app/Contents/MacOS/Dialectic --render "$RUNNER_TEMP/render"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-check
          path: ${{ runner.temp }}/render
          if-no-files-found: ignore
          retention-days: 7
